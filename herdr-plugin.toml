id = "dev.herdr-launcher"
name = "herdr-launcher"
version = "0.0.1"
min_herdr_version = "0.7.5"
description = "Custom launcher for herdr"
platforms = ["macos", "linux"]

[[actions]]
id = "open-launcher"
title = "Open launcher"
contexts = ["workspace"]
command = ["bash", "open.sh"]

[[panes]]
id = "launcher"
title = "Command Launcher"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "launcher.sh"]
